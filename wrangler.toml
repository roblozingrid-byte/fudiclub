name = "fudi-club"
main = "worker/index.js"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]

# Workers Assets — sirve el build estático de Vite
[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# Rutas del dominio personalizado
[[routes]]
pattern = "fudiclub.shop/*"
zone_name = "fudiclub.shop"

[[routes]]
pattern = "www.fudiclub.shop/*"
zone_name = "fudiclub.shop"

[env.production]
name = "fudi-club"

[[env.production.routes]]
pattern = "fudiclub.shop/*"
zone_name = "fudiclub.shop"

[[env.production.routes]]
pattern = "www.fudiclub.shop/*"
zone_name = "fudiclub.shop"
